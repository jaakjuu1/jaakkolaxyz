<!DOCTYPE html>
<html lang="fi">
<head>
<meta charset="utf-8">
<title>Ops Dashboard — Raportti</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>
  body {
    font: 15px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
    color: #1a1a1a; background: #f6f6f4;
    margin: 0; padding: 0;
  }
  .wrap { max-width: 880px; margin: 0 auto; padding: 1.5rem 1.25rem 4rem; }
  h1 { font-size: 1.5rem; }
  pre {
    background: #f0f0ec; border: 1px solid #e3e3df; border-radius: 6px;
    padding: 1rem; overflow-x: auto; white-space: pre-wrap; word-wrap: break-word;
    font: 14px/1.6 ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  }
  a.back { color: #0a6e3a; text-decoration: none; font-size: .9rem; }
  a.back:hover { text-decoration: underline; }
  hr { border: 0; border-top: 1px solid #e3e3df; margin: 1.5rem 0; }
  .loading { color: #6b6b6b; }
</style>
</head>
<body>
<div class="wrap">
  <a class="back" href="/dashboard/">← Takaisin dashboardille</a>
  <h1 id="title">Ladataan...</h1>
  <div class="loading" id="meta">—</div>
  <hr>
  <pre id="report">(odotaa raporttia)</pre>
</div>
<script>
const params = new URLSearchParams(window.location.search);
const siteId = params.get('site');
const apiBase = `${window.location.protocol}//${window.location.host}`;
const apiLocation = new URL(window.location.href);
const apiAuthHeader = apiLocation.username
  ? { Authorization: `Basic ${btoa(`${decodeURIComponent(apiLocation.username)}:${decodeURIComponent(apiLocation.password)}`)}` }
  : {};

function apiUrl(path) {
  return new URL(path, apiBase).toString();
}

function apiFetch(path, options = {}) {
  return fetch(apiUrl(path), {
    ...options,
    credentials: 'same-origin',
    headers: { ...(options.headers || {}), ...apiAuthHeader },
  });
}

if (!siteId) {
  document.getElementById('title').textContent = 'Virhe';
  document.getElementById('report').textContent = 'site-parametri puuttuu URL:sta.';
} else {
  apiFetch('/api/dashboard/report/' + encodeURIComponent(siteId))
    .then(r => r.ok ? r.text() : Promise.reject(r.status + ' ' + r.statusText))
    .then(text => {
      document.getElementById('title').textContent = siteId;
      document.getElementById('meta').textContent = 'Uusin raportti';
      document.getElementById('report').textContent = text;
    })
    .catch(err => {
      document.getElementById('title').textContent = 'Raporttia ei saatavilla';
      document.getElementById('report').textContent = 'Virhe: ' + err;
    });
}
</script>
</body>
</html>
