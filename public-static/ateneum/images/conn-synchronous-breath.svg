<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450">
  <defs>
    <radialGradient id="glow" cx="50%" cy="70%" r="60%">
      <stop offset="0%" stop-color="#f5d0b5" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#1a1a2e" stop-opacity="0"/>
    </radialGradient>
    <filter id="softGlow">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="bigGlow">
      <feGaussianBlur stdDeviation="14"/>
    </filter>
  </defs>
  <rect width="800" height="450" rx="12" fill="#1a1a2e"/>
  <rect width="800" height="450" fill="url(#glow)"/>

  <g transform="translate(280, 0)">
    <ellipse cx="0" cy="250" rx="55" ry="70" fill="#2d2d44" opacity="0.8"/>
    <ellipse cx="0" cy="185" rx="35" ry="40" fill="#3a3a55"/>
    <ellipse cx="0" cy="185" rx="42" ry="47" fill="none" stroke="#e8a87c" stroke-width="1" opacity="0.2"/>
  </g>
  <g transform="translate(520, 0)">
    <ellipse cx="0" cy="250" rx="55" ry="70" fill="#2d2d44" opacity="0.8"/>
    <ellipse cx="0" cy="185" rx="35" ry="40" fill="#3a3a55"/>
    <ellipse cx="0" cy="185" rx="42" ry="47" fill="none" stroke="#e8a87c" stroke-width="1" opacity="0.2"/>
  </g>
  <ellipse cx="305" cy="210" rx="15" ry="40" fill="#f5d0b5" opacity="0.15" filter="url(#bigGlow)"/>
  <ellipse cx="495" cy="210" rx="15" ry="40" fill="#f5d0b5" opacity="0.15" filter="url(#bigGlow)"/>
  <g filter="url(#softGlow)" opacity="0.25">
    <path d="M340,200 Q400,175 460,200" fill="none" stroke="#e8a87c" stroke-width="1.5" stroke-dasharray="4 6"/>
    <path d="M340,205 Q400,185 460,205" fill="none" stroke="#e8a87c" stroke-width="1" stroke-dasharray="3 7"/>
    <path d="M340,210 Q400,195 460,210" fill="none" stroke="#e8a87c" stroke-width="1" stroke-dasharray="2 5"/>
  </g>
  <g opacity="0.12">
    <ellipse cx="280" cy="230" rx="12" ry="8" fill="#f5d0b5" filter="url(#bigGlow)"/>
    <ellipse cx="520" cy="230" rx="12" ry="8" fill="#f5d0b5" filter="url(#bigGlow)"/>
  </g>
  <circle cx="350" cy="175" r="1.5" fill="#e8a87c" opacity="0.3">
    <animate attributeName="opacity" values="0.1;0.4;0.1" dur="4s" repeatCount="indefinite"/>
  </circle>
  <circle cx="450" cy="175" r="1.5" fill="#e8a87c" opacity="0.3">
    <animate attributeName="opacity" values="0.1;0.4;0.1" dur="4s" repeatCount="indefinite"/>
  </circle>
  <circle cx="400" cy="160" r="1" fill="#f5d0b5" opacity="0.2">
    <animate attributeName="opacity" values="0.05;0.3;0.05" dur="4s" begin="1s" repeatCount="indefinite"/>
  </circle>
  <line x1="180" y1="325" x2="620" y2="325" stroke="#2d2d44" stroke-width="1" opacity="0.5"/>
  <rect x="320" y="70" width="160" height="120" rx="4" fill="#3a3a55" opacity="0.15"/>
  <line x1="400" y1="70" x2="400" y2="190" stroke="#2d2d44" stroke-width="1" opacity="0.15"/>
  <line x1="320" y1="120" x2="480" y2="120" stroke="#2d2d44" stroke-width="1" opacity="0.15"/>
</svg>