<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450">
  <defs>
    <radialGradient id="glow" cx="50%" cy="65%" r="55%">
      <stop offset="0%" stop-color="#d4a8a8" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#1a1a2e" stop-opacity="0"/>
    </radialGradient>
    <filter id="softGlow"><feGaussianBlur stdDeviation="6"/></filter>
    <filter id="bigGlow"><feGaussianBlur stdDeviation="15"/></filter>
  </defs>
  <rect width="800" height="450" rx="12" fill="#1a1a2e"/>
  <rect width="800" height="450" fill="url(#glow)"/>
  <!-- makaava hahmo -->
  <g transform="translate(330, 200)">
    <ellipse cx="0" cy="0" rx="55" ry="30" fill="#2d2d44" opacity="0.8"/>
    <ellipse cx="-20" cy="-35" rx="24" ry="28" fill="#3a3a55"/>
  </g>
  <!-- toinen istuu vieressä, käsi sydämellä -->
  <g transform="translate(480, 0)">
    <ellipse cx="0" cy="220" rx="40" ry="65" fill="#2d2d44" opacity="0.8"/>
    <ellipse cx="0" cy="168" rx="28" ry="34" fill="#3a3a55"/>
  </g>
  <!-- käsi rintakehällä -->
  <g filter="url(#softGlow)" opacity="0.35">
    <path d="M410,205 Q380,215 360,210" fill="none" stroke="#d4a8a8" stroke-width="3" stroke-linecap="round"/>
  </g>
  <!-- sydänvalo -->
  <ellipse cx="355" cy="210" rx="12" ry="8" fill="#d4a8a8" opacity="0.15" filter="url(#bigGlow)">
    <animate attributeName="opacity" values="0.1;0.2;0.1" dur="3s" repeatCount="indefinite"/>
  </ellipse>
  <line x1="220" y1="290" x2="580" y2="290" stroke="#2d2d44" stroke-width="1" opacity="0.5"/>
</svg>
