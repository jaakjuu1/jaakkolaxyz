      <stop offset="0%" stop-color="#c9b8a8" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#1a1a2e" stop-opacity="0"/>
    </radialGradient>
    <filter id="softGlow"><feGaussianBlur stdDeviation="5"/></filter>
  </defs>
  <rect width="800" height="450" rx="12" fill="#1a1a2e"/>
