<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450">
  <defs>
    <radialGradient id="glow" cx="50%" cy="60%" r="55%">
      <stop offset="0%" stop-color="#c9a88c" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#1a1a2e" stop-opacity="0"/>
    </radialGradient>
    <filter id="softGlow"><feGaussianBlur stdDeviation="4"/></filter>
    <filter id="bigGlow"><feGaussianBlur stdDeviation="10"/></filter>
  </defs>
  <rect width="800" height="450" rx="12" fill="#1a1a2e"/>
  <rect width="800" height="450" fill="url(#glow)"/>
  <!-- kasvot lähellä toisiaan -->
  <g transform="translate(330, 180)">
    <ellipse cx="0" cy="0" rx="45" ry="50" fill="#2d2d44" opacity="0.7"/>
    <ellipse cx="0" cy="0" rx="48" ry="53" fill="none" stroke="#e8a87c" stroke-width="0.8" opacity="0.15"/>
  </g>
  <g transform="translate(470, 180)">
    <ellipse cx="0" cy="0" rx="45" ry="50" fill="#2d2d44" opacity="0.7"/>
    <ellipse cx="0" cy="0" rx="48" ry="53" fill="none" stroke="#e8a87c" stroke-width="0.8" opacity="0.15"/>
  </g>
  <!-- katseviiva silmien välillä -->
  <g filter="url(#softGlow)" opacity="0.2">
    <line x1="360" y1="175" x2="440" y2="175" stroke="#f5d0b5" stroke-width="1.5" stroke-dasharray="3 5"/>
    <line x1="360" y1="180" x2="440" y2="180" stroke="#e8a87c" stroke-width="1" stroke-dasharray="2 6"/>
  </g>
  <ellipse cx="400" cy="175" rx="5" ry="5" fill="#f5d0b5" opacity="0.15" filter="url(#bigGlow)"/>
  <line x1="250" y1="290" x2="550" y2="290" stroke="#2d2d44" stroke-width="1" opacity="0.5"/>
</svg>
