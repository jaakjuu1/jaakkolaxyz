<!doctype html>
<html lang="fi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Protokolla — hypnoterapia</title>
<link rel="stylesheet" href="lesson.css">
<style>
@media print { .crumb, .noprint { display:none } body { background:#fff } }
.grid { display:grid; gap:.8rem; margin:1.4rem 0 }
.field { border:1px solid var(--rule); border-radius:4px; padding:.8rem 1rem; min-height:2.8rem }
.field label { display:block; font-size:.8rem; color:var(--muted); margin:0 0 .3rem }
</style>
</head>
<body>
<main class="wrap">
  <p class="crumb"><a href="../index.html">Hypnoterapia</a> · referenssi</p>
  <h1>10 min protokolla</h1>
  <p>Täytä ennen sessiota. Yksi rata. Yksi lause. Paluu merkitään etukäteen.</p>
  <div class="grid">
    <div class="field"><label>Päivä / kello</label></div>
    <div class="field"><label>Paikka (tuoli / sänky)</label></div>
    <div class="field"><label>Rata: jännitys (täysi paluu) tai uni (ei lasketa)</label></div>
    <div class="field"><label>Lause (myönteinen, nyt, kehossa, ei kieltoa)</label></div>
    <div class="field"><label>Induktio (yksi kohde, ~2 min)</label></div>
    <div class="field"><label>Paluusääntö tälle radalle</label></div>
    <div class="field"><label>Stop-kriteeri (toimintakyky)</label></div>
    <div class="field"><label>Havainto session jälkeen (ei tulkintaa)</label></div>
  </div>
  <p>Jännitys: “Palaan nyt” → 1–5 → kolme esinettä → nousu. Uni: unen saa tulla. Kortti: <a href="stop.html">stop.html</a>.</p>
  <p class="footer-note noprint"><a href="../lessons/0006-oma-protokolla.html">Oppitunti 0006</a></p>
</main>
</body>
</html>
